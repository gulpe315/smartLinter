<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>SmartLinter InDesign UXP Bridge</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: var(--uxp-host-background-color, #282828);
            color: var(--uxp-host-text-color, #e0e0e0);
            font-size: 11px;
        }
        h2 { margin-top: 0; font-size: 13px; color: #ffffff; }
        .status-pill {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .pill-shown { background-color: #2e7d32; color: #ffffff; }
        .pill-hidden { background-color: #f57f17; color: #ffffff; }
        .pill-closed { background-color: #c62828; color: #ffffff; }
        button {
            width: 100%;
            padding: 6px;
            margin: 4px 0;
            background: #3e3e3e;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #4e4e4e; }
        #logBox {
            margin-top: 10px;
            height: 160px;
            overflow-y: auto;
            background: #1a1a1a;
            color: #a3e635;
            font-family: monospace;
            font-size: 10px;
            padding: 6px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h2>⚡ SmartLinter InDesign Bridge</h2>
    <div>
        <span id="lifecycleStatus" class="status-pill pill-shown">State: Initializing</span>
    </div>
    <p>UXP Plugin Lifecycle & Background Polling Spike</p>
    
    <button id="btnSimulateDocChange">Simulate Selection Changed</button>
    <button id="btnClearLog">Clear Log</button>

    <div style="margin-top: 8px;"><strong>Lifecycle & Polling Log:</strong></div>
    <div id="logBox"></div>

    <script src="indesign_panel.js"></script>
</body>
</html>
