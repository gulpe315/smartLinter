[package]
name = "smart-linter"
version = "0.1.0"
edition = "2021"
description = "SmartLinter Desktop Backend & Core Engine"
authors = ["SmartLinter Team"]

[lib]
name = "smart_linter"
path = "src/lib.rs"

[[bin]]
name = "smart-linter"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
serde_json = "1.0"
tokio-tungstenite = "0.21"
reqwest = { version = "0.12", features = ["json"] }

