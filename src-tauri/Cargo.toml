[package]
name = "smart-linter"
version = "0.1.0"
edition = "2021"
description = "SmartLinter Desktop Backend & Core Engine"
authors = ["SmartLinter Team"]
default-run = "smart-linter"

[lib]
name = "smart_linter"
path = "src/lib.rs"

[features]
default = []
kiwi-spike = ["dep:kiwi-rs"]

[[bin]]
name = "smart-linter"
path = "src/main.rs"

[[bin]]
name = "kiwi_spike_harness"
path = "src/bin/kiwi_spike_harness.rs"
required-features = ["kiwi-spike"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
rand = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
kiwi-rs = { version = "=2026.8.26", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0"
tokio-tungstenite = "0.21"
