[package]
name = "smart-linter"
version = "0.1.0"
edition = "2021"
description = "SmartLinter Desktop Backend & Core Engine"
authors = ["SmartLinter Team"]

[lib]
name = "smart_linter"
path = "src/lib.rs"

[[bin]]
name = "smart-linter"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
